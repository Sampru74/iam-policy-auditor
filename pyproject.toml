[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-policy-auditor"
version = "0.1.0"
description = "An offline analyzer for broad AWS IAM identity-policy permissions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
iam-policy-auditor = "iam_policy_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
